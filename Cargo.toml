# Root Cargo workspace for the Rust MCP servers.
#
# The crates were imported from their release tags (see MIGRATIONS.md); each
# keeps its own Cargo.toml, build.rs, src/, tests/, and rust-toolchain.toml
# under crates/<name>/. resolver = "2" is explicit because both packages are
# edition 2021 (which implies resolver 2 when built standalone); a virtual
# workspace would otherwise default to resolver 1 and change feature
# unification.
[workspace]
resolver = "2"
members = ["crates/*"]

# The imported crates carry their own [profile.dev]/[profile.test] blocks, but
# Cargo ignores profiles outside the workspace root (and warns). These root
# profiles are the crates' identical intent, so workspace builds keep the
# intended debug info. The crate manifests stay byte-identical to the tags.
[profile.dev]
debug = "line-tables-only"

[profile.test]
inherits = "dev"
