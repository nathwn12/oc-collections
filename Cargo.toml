# Root Cargo workspace for the Rust MCP servers.
#
# The imported crates (crates/gladius, crates/puppet) were removed on
# 2026-10-29; those MCP servers stay on their own release lanes (see
# MIGRATIONS.md). This stays a valid virtual workspace with no members: a
# `crates/*` glob is an error when it matches nothing, so members is explicit.
# resolver = "2" is kept for any future member.
[workspace]
resolver = "2"
members = []

# The removed crates carried their own [profile.dev]/[profile.test] blocks, but
# Cargo ignores profiles outside the workspace root (and warns). These root
# profiles are their intent; they are inert while the workspace has no members.
[profile.dev]
debug = "line-tables-only"

[profile.test]
inherits = "dev"
