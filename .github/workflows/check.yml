name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Node before the index steps: the vocabulary guard below is a Node script,
      # so the LTS this workflow pins is the one it must run under.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Index integrity
        shell: bash
        run: |
          git ls-files --error-unmatch README.md LICENSE CHANGELOG.md MIGRATIONS.md
          git ls-files --error-unmatch packages/oc-bifrost/package.json
          # Implementation files live in packages/; the root stays an index.
          test "$(git ls-files '*.ts' '*.tsx' | grep -v -E '^packages/' | wc -l)" -eq 0
      - name: Index structure (offline)
        # The structural half needs no registry: it checks the table names
        # against the repo's package inventory. The self-test proves it can go
        # red without network.
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-index.ps1 --structural
          pwsh -NoProfile -File scripts/check-index.selftest.ps1
      - name: No internal vocabulary in the index's own files
        # One definition, shared with `npm run check`: the patterns, the excluded
        # path and the "a grep error is never clean" rule live in the script.
        shell: pwsh
        run: node scripts/check-vocabulary.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Documentation truth (offline)
        # Path claims in maintainer docs, plus the checker's own red/green proof.
        shell: pwsh
        run: |
          node scripts/check-docs.mjs
          node scripts/check-docs.selftest.mjs
      - name: Install workspace dependencies
        shell: pwsh
        run: npm ci
      - name: Workspace typecheck and compile
        # PR gate stays static: no package test suites and no pack verification.
        # release.yml runs the full check and pack check before publishing.
        # flight-deck's compile is a bun bundle that never typechecks, so its
        # tsc pass is named explicitly; bifrost's compile is tsc and covers both.
        shell: pwsh
        run: |
          npm run typecheck -w packages/oc-flight-deck
          node scripts/workspace-run.mjs build
