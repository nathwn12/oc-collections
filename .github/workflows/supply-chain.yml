name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    # Least privilege for reporting: v2.0.0 opens issues on cron and check runs
    # on dispatch, with no report-only input. Workflow default stays read-only.
    permissions:
      contents: read   # actions/checkout
      issues: write    # schedule -> advisory issue
      checks: write    # workflow_dispatch -> check run
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      # picomatch 4.0.7 is the newest release and the advisory covers <=4.0.7,
      # so there is no patched version to move to yet (transitive: tinyglobby >
      # node-gyp > @opencode/util). Scoped to that advisory only; remove this
      # ignore once picomatch > 4.0.7 ships and the lockfile can take it.
      - run: bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
      # The Rust engines keep their own repositories and Cargo locks, so this
      # index has no Cargo lockdir to audit. See docs/MIGRATIONS.md.
