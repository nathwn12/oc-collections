name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      # picomatch 4.0.7 is the newest release and the advisory covers <=4.0.7,
      # so there is no patched version to move to yet (transitive: tinyglobby >
      # node-gyp > @opencode/util). Scoped to that advisory only; remove this
      # ignore once picomatch > 4.0.7 ships and the lockfile can take it.
      - run: bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
      - uses: dtolnay/rust-toolchain@stable
      # The root Cargo.toml is a virtual workspace with `members = []`, so there
      # is no ./Cargo.lock at the repo root. The two imported Rust engines each
      # kept their own lock (see docs/MIGRATIONS.md), so cargo audit has to be
      # pointed at each one; the default working-directory of "." finds nothing.
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/oc-gladius
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/oc-puppet
