# The gate. Four jobs on three lanes: `static` runs the no-install checks on
# Windows (index files, structural + selftest, vocabulary, docs + selftest);
# `plan` derives the per-package check matrix from the shared plan;
# `check` runs one leg per workspace on Windows through the scoped wrapper
# (`node scripts/workspace-run.mjs check --package <name>`), so a red package
# fails its own leg instead of the whole monorepo gate; `posix` runs janua's
# own tests on Ubuntu, where its POSIX pipe path executes instead of skipping.
# `static` and `check` run in parallel: the fast lane fails in about a second
# on a missing file, the matrix proves each package installs and checks green.
#
# `npm run check` stays the documented root gate: scripts/check-docs.mjs, then
# its selftest, then scripts/workspace-run.mjs check, which runs each
# workspace's own `check` exactly as named in scripts/workspace-plan.mjs
# (fail-closed: a workspace missing from the plan is an error, never a skip).
# CI runs the same commands per package rather than the raw fan-out, so the
# local gate (`npm run check`) and the remote gate prove the same steps: a
# tree that is green locally has no other step to meet remotely.
#
# The matrix legs set OC_CHECK_CACHE=0 on purpose: the content cache exists to
# make a local re-run cheap, but a gate that skips is not a gate. Every leg
# proves its package from a clean install.
#
# The previous gate ran on ubuntu-latest and only proved four root files were
# tracked. janua is cross-platform: the Windows jobs keep the full gate, and
# the `posix` job proves the POSIX branch that a Windows run cannot reach.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels its own queued runs on that branch instead of stacking
# them behind older ones: the newest commit is the only one worth gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    # No install: tracked-file facts, structural checks and Node scripts that
    # need only the tree. Fails in about a second on a missing file.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheap guard first: a missing licence, README, changelog or signature is
      # a tracked-file fact, answered in about a second with no install.
      - name: Index files present
        run: git ls-files --error-unmatch README.md LICENSE CHANGELOG.md assets/signature.svg

      - name: Index structure (offline)
        # The structural half needs no registry: it checks the table names
        # against the repo's package inventory. The self-test proves it can go
        # red without network.
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-index.ps1 --structural
          pwsh -NoProfile -File scripts/check-index.selftest.ps1

      - name: No internal vocabulary in the index's own files
        # One definition, shared with `npm run check`: the patterns, the excluded
        # path and the "a grep error is never clean" rule live in the script.
        run: node scripts/check-vocabulary.mjs

      - name: Documentation truth (offline)
        # Path claims in maintainer docs, plus the checker's own red/green proof.
        shell: pwsh
        run: |
          node scripts/check-docs.mjs
          node scripts/check-docs.selftest.mjs

  # One leg per workspace, fanned out from the shared plan. A leg proves only
  # its own package (`--package`), with the content cache off: a gate that
  # skips is not a gate. Logs stay small because each leg carries one
  # package's output, and a flake fails its own leg while the rest still
  # report. The full local gate (`npm run check`) remains the pre-push proof.
  plan:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive the check matrix from the shared plan
        id: set
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci-matrix.mjs)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "checking ${matrix}"

  check:
    needs: plan
    runs-on: windows-latest
    # oc-harness-setup alone is ~51s locally (real npm installs plus a
    # packed-tarball install) and a Windows runner is slower than this box,
    # so 15 minutes bounds one package with headroom instead of the
    # 360-minute default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # oc-flight-deck's check is `bun run typecheck && bun test`, so bun is
      # a gate dependency for that leg only, pinned to the version the
      # release workflow already runs.
      - uses: oven-sh/setup-bun@v2
        if: matrix.package == 'oc-flight-deck'
        with:
          bun-version: 1.4.2

      - name: Toolchain versions
        # Logged, never asserted: when a leg goes red, the first question is
        # what it ran on, and the answer is in the log, not in a guess.
        run: |
          node --version
          npm --version
          if (Get-Command bun -ErrorAction SilentlyContinue) { bun --version }

      - name: Install workspaces
        # The root manifest declares no dependencies, and each workspace's
        # check resolves its bins through the hoisted root node_modules
        # that `npm ci` builds from package-lock.json.
        run: npm ci

      - name: Check ${{ matrix.package }}
        env:
          OC_CHECK_CACHE: 0
        run: node scripts/workspace-run.mjs check --package "${{ matrix.package }}"

  # janua's pipe path has POSIX-only branches: a detached child leading its own
  # process group, and negative-pid group kills. The Windows matrix legs skip the
  # descendant test, so this job runs the pipe test where that branch executes.
  # The upgrade tests run here too: they reach the POSIX branch of the npm command
  # line and the home/pointer/launcher rules, and use an injected installer, so
  # they need no registry. The rest of janua's suite is left to the Windows gate:
  # its pre-existing PTY tests assume Windows and are outside this job's scope.
  posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only janua: the root gate covers every workspace on Windows, and this
      # job exists to exercise this package's POSIX pipe path.
      - name: Install janua workspace
        run: npm ci --workspace @nathwn12/janua

      - name: Run POSIX pipe and upgrade tests
        working-directory: packages/janua
        run: node --test "test/pipe.test.js" "test/upgrade.test.js"
