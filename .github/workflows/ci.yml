# The gate. Five jobs on four lanes: `static` runs the no-install checks on
# Windows; `docs` carries the folded docs-report checks on Ubuntu (lychee
# downloads a Linux binary, so it cannot run on the Windows runner); `plan`
# derives the per-package check matrix from the shared plan; `check` runs one
# leg per workspace on Windows through the scoped wrapper
# (`node scripts/workspace-run.mjs check --package <name>`), so a red package
# fails its own leg instead of the whole monorepo gate; `posix` runs janua's
# own tests on Ubuntu, where its POSIX pipe path executes instead of skipping.
#
# `npm run check` stays the documented root gate: scripts/check-docs.mjs, then
# its selftest, then scripts/workspace-run.mjs check, which runs each
# workspace's own `check` exactly as named in scripts/workspace-plan.mjs
# (fail-closed: a workspace missing from the plan is an error, never a skip).
#
# The matrix legs set OC_CHECK_CACHE=0 on purpose: the content cache exists to
# make a local re-run cheap, but a gate that skips is not a gate. Every leg
# proves its package from a clean install; only the bun *download* cache is
# shared between runs.
#
# Scope comes from the GitHub API, never from a full checkout of untrusted PR
# code. Every job checks out fetch-depth: 1. A docs-only change keeps the
# required check (`static`) green and skips the build lanes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel older PR runs on the same ref instead of stacking them. A run on the
# default branch always finishes: the run that gates it is the one that reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  # The scope steps list PR files through gh; a read token is enough.
  pull-requests: read

env:
  REPO: ${{ github.repository }}
  EVENT: ${{ github.event_name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BEFORE: ${{ github.event.before }}
  AFTER: ${{ github.event.after }}

jobs:
  static:
    runs-on: windows-latest
    # No install: tracked-file facts, structural checks and Node scripts that
    # need only the tree. Fails in about a second on a missing file.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect a docs-only change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename')
          else
            changed=""
          fi
          # An empty list (dispatch, all-zero before, or an API failure) is
          # fail-closed: run the gate rather than silently skipping it.
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Cheap guard first: a missing licence, README, changelog or signature is
      # a tracked-file fact, answered in about a second with no install.
      - name: Index files present
        if: steps.scope.outputs.code == 'true'
        run: git ls-files --error-unmatch README.md LICENSE CHANGELOG.md assets/signature-glyph.svg

      - name: Index structure (offline)
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-index.ps1 --structural
          pwsh -NoProfile -File scripts/check-index.selftest.ps1

      - name: No internal vocabulary in the index's own files
        if: steps.scope.outputs.code == 'true'
        run: node scripts/check-vocabulary.mjs

      - name: Documentation truth (offline)
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          node scripts/check-docs.mjs
          node scripts/check-docs.selftest.mjs

      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"

  # Folded in from docs-report.yml, which branch protection does not require.
  # Kept on ubuntu-latest: lychee's action unpacks an x86_64-linux binary.
  docs:
    # docs-report.yml was pull_request-only; keep push runs lean.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: docs gate (report-only)
        run: node docs-check.mjs --report
      - name: link check (offline, report-only)
        uses: lycheeverse/lychee-action@f796c8b7d468feb9b8c0a46da3fac0af6874d374 # v2.2.0
        with:
          args: --no-progress --offline '**/*.md'
          fail: false

  # One leg per workspace, fanned out from the shared plan. A leg proves only
  # its own package (`--package`), with the content cache off: a gate that
  # skips is not a gate. Logs stay small because each leg carries one
  # package's output, and a flake fails its own leg while the rest still
  # report. The full local gate (`npm run check`) remains the pre-push proof.
  plan:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Derive the check matrix from the shared plan
        id: set
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci-matrix.mjs)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "checking ${matrix}"

  check:
    needs: plan
    if: github.event_name != 'push'
    runs-on: windows-latest
    # oc-harness-setup alone is ~51s locally (real npm installs plus a
    # packed-tarball install) and a Windows runner is slower than this box,
    # so 15 minutes bounds one package with headroom instead of the
    # 360-minute default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect a docs-only change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename')
          else
            changed=""
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22

      # bun is the package manager and a gate dependency for every leg: the
      # workspace scripts invoke `bun run`, and oc-flight-deck's check is
      # `bun run typecheck && bun test`. Pinned to the version the root
      # manifest's `packageManager` names (bun@1.4.4).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: 1.4.4

      # The key prefix differs from release.yml's `-bun-` cache, which holds
      # node_modules; these two archives must never be restored into each
      # other's paths.
      - name: Cache bun downloads
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Toolchain versions
        if: steps.scope.outputs.code == 'true'
        run: |
          node --version
          npm --version
          bun --version

      - name: Install workspaces
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Check ${{ matrix.package }}
        if: steps.scope.outputs.code == 'true'
        env:
          OC_CHECK_CACHE: 0
          PACKAGE: ${{ matrix.package }}
        run: node scripts/workspace-run.mjs check --package "$env:PACKAGE"

      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"

  # janua's pipe path has POSIX-only branches: a detached child leading its own
  # process group, and negative-pid group kills. The Windows matrix legs skip
  # the descendant test, so this job runs the pipe test where that branch
  # executes. The upgrade tests run here too: they reach the POSIX branch of
  # the npm command line and the home/pointer/launcher rules, and use an
  # injected installer, so they need no registry.
  posix:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect a docs-only change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename')
          else
            changed=""
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: 1.4.4

      - name: Cache bun downloads
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Run POSIX pipe and upgrade tests
        if: steps.scope.outputs.code == 'true'
        working-directory: packages/janua
        run: node --test "test/pipe.test.js" "test/upgrade.test.js"

      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"
