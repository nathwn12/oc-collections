# The gate. Three jobs on two lanes: `static` runs the no-install checks on
# Windows (index files, structural + selftest, vocabulary, docs + selftest);
# `workspaces` installs on Windows and runs the real per-workspace checks
# through the root wrapper; `posix` runs janua's own tests on Ubuntu, where
# its POSIX pipe path executes instead of skipping. `static` and `workspaces`
# run in parallel: the fast lane fails in about a second on a missing file,
# the slow lane proves the tree installs and checks green.
#
# `npm run check` is the documented root gate: scripts/check-docs.mjs, then its
# selftest, then scripts/workspace-run.mjs check, which runs each workspace's
# own `check` exactly as named in scripts/workspace-plan.mjs (fail-closed: a
# workspace missing from the plan is an error, never a skip). The wrapper is
# used rather than the raw fan-out so a doc claim that no longer matches the
# tree fails here too.
#
# The previous gate ran on ubuntu-latest and only proved four root files were
# tracked. janua is cross-platform: the Windows jobs keep the full gate, and
# the `posix` job proves the POSIX branch that a Windows run cannot reach.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels its own queued runs on that branch instead of stacking
# them behind older ones: the newest commit is the only one worth gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    # No install: tracked-file facts, structural checks and Node scripts that
    # need only the tree. Fails in about a second on a missing file.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheap guard first: a missing licence, README, changelog or signature is
      # a tracked-file fact, answered in about a second with no install.
      - name: Index files present
        run: git ls-files --error-unmatch README.md LICENSE CHANGELOG.md assets/signature.svg

      - name: Index structure (offline)
        # The structural half needs no registry: it checks the table names
        # against the repo's package inventory. The self-test proves it can go
        # red without network.
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-index.ps1 --structural
          pwsh -NoProfile -File scripts/check-index.selftest.ps1

      - name: No internal vocabulary in the index's own files
        # One definition, shared with `npm run check`: the patterns, the excluded
        # path and the "a grep error is never clean" rule live in the script.
        run: node scripts/check-vocabulary.mjs

      - name: Documentation truth (offline)
        # Path claims in maintainer docs, plus the checker's own red/green proof.
        shell: pwsh
        run: |
          node scripts/check-docs.mjs
          node scripts/check-docs.selftest.mjs

  workspaces:
    runs-on: windows-latest
    # A local cold `npm run check` takes ~73s, and oc-harness-setup alone is
    # ~51s of it (real npm installs plus a packed-tarball install). A Windows
    # runner is slower than this box and pays a cold npm cache, so 20 minutes
    # is roughly 10x the observed run while still failing far sooner than the
    # 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # oc-flight-deck's check is `bun run typecheck && bun test`, so bun is a
      # gate dependency, not a convenience. Pinned to the version the release
      # workflow already runs on windows-latest.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Required: the root manifest declares no dependencies, and each
      # workspace's check resolves its bins through the hoisted root
      # node_modules that `npm ci` builds from package-lock.json. Skipped on
      # a cache hit: the restore above already provides those bytes.
      - name: Install workspaces
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Workspace check
        run: npm run check

  # janua's pipe path has POSIX-only branches: a detached child leading its own
  # process group, and negative-pid group kills. The Windows workspaces job skips the
  # descendant test, so this job runs the pipe test where that branch executes.
  # The upgrade tests run here too: they reach the POSIX branch of the npm command
  # line and the home/pointer/launcher rules, and use an injected installer, so
  # they need no registry. The rest of janua's suite is left to the Windows gate:
  # its pre-existing PTY tests assume Windows and are outside this job's scope.
  posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only janua: the root gate covers every workspace on Windows, and this
      # job exists to exercise this package's POSIX pipe path.
      - name: Install janua workspace
        run: npm ci --workspace @nathwn12/janua

      - name: Run POSIX pipe and upgrade tests
        working-directory: packages/janua
        run: node --test "test/pipe.test.js" "test/upgrade.test.js"
