# Private release lane: a push to main tags a private package, and cannot publish.
#
# Same derivation as the public lane (scripts/derive-release.mjs), and the same
# gate: the version comes from the conventional commits since the package's
# highest tag, the changelog is closed in the runner, the tarball is packed and
# probed, and the tag is created at the pushed commit. Then it stops.
#
# The difference is a permission, not a conditional: there is no `id-token:
# write` here and no `npm publish` step, so publishing is impossible in this
# workflow rather than skipped by an `if` someone could later flip. The public
# lane keeps no knowledge of private packages at all.
#
# Packages come from PRIVATE in scripts/release-target.mjs, never from ALLOWED.
name: release-private

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Derive, gate and pack without tagging
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-private-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      count: ${{ steps.derive.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Derive the private release set
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/derive-release.mjs --all-private

      - name: Nothing to release
        if: ${{ steps.derive.outputs.count == '0' }}
        shell: bash
        run: |
          echo "nothing to release: no private package has a releasable commit since its tag"
          {
            echo "## release-private"
            echo ""
            echo "nothing to release"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Derive the package version
        id: derive
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          status=0
          node scripts/derive-release.mjs --package "${PACKAGE}" --json --prepare > "$RUNNER_TEMP/release/derive.json" || status=$?
          if [ "${status}" -eq 0 ]; then exit 0; fi
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
            for (const item of r.refusals ?? []) console.log(`  ${item.code}: ${item.message}`)
          ' "$RUNNER_TEMP/release/derive.json" || true
          echo "REFUSED=1" >> "$GITHUB_ENV"
          echo "::warning::${PACKAGE} refused at derivation; skipping it"

      - name: Fetch the tags
        if: ${{ env.REFUSED != '1' }}
        shell: bash
        run: git fetch --tags --force origin

      - name: Skip a package whose tag already exists
        if: ${{ env.REFUSED != '1' }}
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if node scripts/derive-release.mjs --tag-exists "${TAG}"; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::notice::${TAG} already exists; skipping this package, no tag is ever moved"
          fi

      - name: Refuse a version that moved since the plan
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
          PLANNED: ${{ matrix.version }}
        run: |
          set -euo pipefail
          version="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(r.version))' "$RUNNER_TEMP/release/derive.json")"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [ "${version}" != "${PLANNED}" ]; then
            echo "::warning::${PACKAGE} derives ${version}, the plan said ${PLANNED}; skipping it"
            echo "REFUSED=1" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: npm ci

      - name: Close the changelog at the derived version
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          args=(--package "${PACKAGE}" --version "${VERSION}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          node scripts/close-changelog.mjs "${args[@]}"

      - name: Write the version cells in the runner
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: node scripts/derive-release.mjs --write-cells --package "${PACKAGE}" --version "${VERSION}"

      - name: build
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: npm run build

      - name: test
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: node scripts/workspace-run.mjs test

      - name: pack-check
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: node scripts/pack-check.mjs

      - name: cleanroom
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: node scripts/cleanroom.mjs --package "${PACKAGE}"

      - name: Assert the version cells (manifest, index, lockfile)
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: node scripts/derive-release.mjs --assert-cells --package "${PACKAGE}" --version "${VERSION}"

      - name: Create the release tag at the pushed commit
        # The last act. There is no publish step in this workflow and no
        # id-token permission, so the tag is the whole release.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' && !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::warning::tag ${TAG} appeared while the gate ran; skipping this package"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "tagged ${TAG} at $(git rev-parse HEAD)"

      - name: Restore the runner-written cells
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          git checkout -- .
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::working tree is not clean after the release:"
            echo "${dirty}"
            exit 1
          fi
          echo "tree: clean; nothing was committed"

      - name: Summary
        if: always()
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
          PLANNED: ${{ matrix.version }}
        run: |
          {
            echo "## release-private"
            echo ""
            echo "| package | version | outcome |"
            echo "| --- | --- | --- |"
            if [ "${REFUSED:-0}" = "1" ]; then outcome="refused"
            elif [ "${SKIP:-0}" = "1" ]; then outcome="skipped (tag exists)"
            elif [ "${{ inputs.dry_run }}" = "true" ]; then outcome="would tag (dry run)"
            else outcome="tagged, not published"; fi
            echo "| ${PACKAGE} | ${VERSION:-${PLANNED}} | ${outcome} |"
          } >> "$GITHUB_STEP_SUMMARY"
