# Release lane: the version and the tag are produced by this run, after the gate.
#
# Nothing here takes a version from a human. One dispatch names the package; the
# run derives the next version from the conventional commits since that
# package's highest `<package>@<version>` tag (scripts/derive-release.mjs),
# refuses when the repository has not reached that version, gates on build, test
# and tarball, closes the package changelog at the derived version, and only
# then creates the tag and publishes. A hand-pushed tag publishes nothing: the
# tag is an output of this lane, not an input.
#
# Tag convention: <package-name>@<version>
#   oc-flight-deck@0.20.2
#   @nathwn12/oc-bifrost@1.6.10        (scoped: two @ characters; split on the last)
#
# No Changesets: npm 12 breaks Changesets 2's `npm info --json` parsing, and
# these packages version independently.
#
# The releasable set is the ALLOWED list in scripts/release-target.mjs; the
# dispatch choice list below must match it, and every other workspace is
# source-only.
#
# OIDC trusted publishing only: id-token: write, --provenance; no auth-token
# variable, no secrets, no OTP.
#
# contents: write is for two acts only: committing the closed changelog to main
# and pushing the tag this run created. Neither is ever forced.
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to release (the version is derived, never typed)
        required: true
        type: choice
        options:
          - '@nathwn12/oc-bifrost'
          - '@nathwn12/janua'
          - oc-flight-deck
          - oc-harness-setup
          - oc-talk
          - rea-shim
      dry_run:
        description: Derive, gate and pack without committing, tagging or publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Everything that can say no runs here, before the tag exists. The tag is the
  # first irreversible act and it belongs to the publish job below.
  gate:
    runs-on: windows-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the derivation reads the package's highest
          # tag and every commit since it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Derive the release version
        # First step that reads a version, and it reads none from a human: the
        # level comes from the commits, and the run refuses when the changelog,
        # the manifest or the commit range has not reached it.
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/derive-release.mjs --package "${{ inputs.package }}"

      - name: Refuse a tag that already exists
        # After derivation, before anything is built: a version that is already
        # tagged is a mistake in the derivation, not a build failure.
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.derive.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "::error::tag ${RELEASE_TAG} already exists in this clone; nothing is retagged"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::tag ${RELEASE_TAG} already exists on origin; nothing is retagged"
            exit 1
          fi
          echo "tag ${RELEASE_TAG} is free"

      - name: Guard the release commit is on origin/main
        shell: bash
        run: |
          set -euo pipefail
          subject="${GITHUB_SHA}"
          git fetch --no-tags origin main
          main="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$subject" "$main"; then
            echo "::error::dispatched commit is at ${subject}, which is not an ancestor of origin/main (${main}); merge it into main before releasing"
            exit 1
          fi

      - name: Assert the package manifest carries the derived version
        # The derived version is the authority; this assert is what makes a
        # hand-picked manifest version fail the release instead of shipping.
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(node scripts/release-target.mjs --package "${{ steps.derive.outputs.name }}" | sed -n 's/^version=//p')"
          if [ "${resolved}" != "${{ steps.derive.outputs.version }}" ]; then
            echo "::error::${{ steps.derive.outputs.name }} manifest version ${resolved} != derived ${{ steps.derive.outputs.version }}"
            exit 1
          fi

      - name: Guard registry state (never republish)
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.derive.outputs.name }}"
          # A package with no published version yet is a first release, not a
          # registry failure: npm answers E404 and the guard runs on an empty list.
          if ! npm view "${name}" versions --json > "$RUNNER_TEMP/versions.json" 2> "$RUNNER_TEMP/view.err"; then
            if grep -q 'E404' "$RUNNER_TEMP/view.err"; then
              echo "[]" > "$RUNNER_TEMP/versions.json"
              echo "registry: ${name} has no published version yet (first release)"
            else
              cat "$RUNNER_TEMP/view.err"
              exit 1
            fi
          fi
          node scripts/release-target.mjs --registry-guard "$RUNNER_TEMP/versions.json" "${{ steps.derive.outputs.version }}"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: "Gate: build, test and tarball"
        # The gate the tag may not precede. Everything below builds on it.
        shell: pwsh
        run: |
          npm run build
          node scripts/workspace-run.mjs test
          node scripts/pack-check.mjs

      - name: Close the changelog at the derived version
        # After build and test, before the tag: the tag records the closed
        # changelog. Idempotent, so a re-run of this job after the changelog was
        # already closed writes nothing.
        shell: bash
        run: |
          set -euo pipefail
          args=(--package "${{ steps.derive.outputs.name }}" --version "${{ steps.derive.outputs.version }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/close-changelog.mjs "${args[@]}"

      - name: Assert the version cells (manifest, index, lockfile)
        # Assert, never overwrite: the three cells a release has to agree on are
        # read back and compared, not written.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/derive-release.mjs \
            --assert-cells \
            --package "${{ steps.derive.outputs.name }}" \
            --version "${{ steps.derive.outputs.version }}"

      - name: Docs and index still pass
        shell: pwsh
        run: |
          node scripts/check-docs.mjs
          pwsh -NoProfile -File scripts/check-index.ps1 --structural

      - name: Publish (dry run)
        if: inputs.dry_run
        shell: pwsh
        run: npm publish --workspace "${{ steps.derive.outputs.name }}" --access public --dry-run

      - name: Commit and push the closed changelog
        id: push
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.derive.outputs.dir }}/CHANGELOG.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          if git diff --cached --quiet; then
            echo "changelog: already closed, nothing to commit"
          else
            git commit -m "chore(release): close ${{ steps.derive.outputs.name }} ${{ steps.derive.outputs.version }} changelog"
            # Never forced: a main that moved during the gate fails this step.
            git push origin "HEAD:refs/heads/main"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    # The tag is created here, immediately before the publish that it names, and
    # only for a gate that passed. A dry run reaches no part of this job.
    needs: gate
    if: ${{ needs.gate.outputs.commit != '' }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the gate pushed, which carries the closed changelog.
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build what is published
        shell: pwsh
        run: npm run build

      - name: Create the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::tag ${RELEASE_TAG} appeared while the gate ran; nothing is retagged"
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "tagged ${RELEASE_TAG} at $(git rev-parse HEAD)"

      - name: Publish (OIDC trusted publishing)
        shell: pwsh
        run: npm publish --workspace "${{ needs.gate.outputs.name }}" --access public --provenance

      - name: Verify the released package on the registry
        # Post-publish only: the registry half cannot pass before the version
        # exists. It is scoped to this run's package; the full table is checked
        # by the same command without --package. npm can take several minutes to
        # propagate a new version, so retry only the not-published shape; every
        # other failure is a real failure and exits immediately.
        shell: pwsh
        run: |
          $attempts = 17
          # Observed propagation was 4-7 minutes. Ten attempts (~4 minutes)
          # would still fail at the upper bound, so 17 attempts with 30s waits
          # after the first three cap the wait at about 7m15s.
          $waits = @(10, 15, 20) + @(30) * ($attempts - 4)
          $name = "${{ needs.gate.outputs.name }}"
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $output = & pwsh -NoProfile -File scripts/check-index.ps1 --registry --package $name 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            $summary = ($output | Where-Object { $_ -match '^registry:' } | Select-Object -Last 1)
            Write-Output "attempt $attempt/$attempts (exit $code): $summary"
            if ($code -eq 0) { exit 0 }
            $fails = @($output | Where-Object { $_ -match '^FAIL' })
            $notPublished = @($fails | Where-Object { $_ -match 'npm\s+version\s+\S+\s+not published' })
            if ($fails.Count -eq 0 -or $notPublished.Count -ne $fails.Count) {
              Write-Output "not a propagation failure; not retrying"
              exit $code
            }
            if ($attempt -eq $attempts) { break }
            $wait = $waits[$attempt - 1]
            Write-Output "version not visible yet; waiting $wait seconds before attempt $($attempt + 1)"
            Start-Sleep -Seconds $wait
          }
          Write-Output "version still not visible after $attempts attempts"
          exit 1
