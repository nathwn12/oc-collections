# Release lane: a merge to main releases every package with a releasable commit.
#
# Push trigger. `scripts/derive-release.mjs --all` reads each package's highest
# `<package>@<version>` tag, derives the next version from the conventional
# commits since it, and lists every package that has one. A package with no
# releasable commit is listed as skipped and is never attempted; when every
# package is skipped the run prints "nothing to release" and exits 0.
#
# Nothing takes a version from a human and nothing is committed. Per package,
# in one job of the matrix, in this order: derive -> skip a tag that already
# exists -> refuse a mismatch with the plan -> install -> close the changelog ->
# write the derived version into the manifest, the root index cell and the
# lockfile -> build, test, pack, cleanroom -> assert the cells -> tag
# `<package>@<version>` at the pushed commit -> publish -> verify the registry.
# The changelog close and the version write exist only in the runner so the
# tarball carries them; the last step restores every tracked file and proves
# `git status --porcelain` is empty. No commit, no PR, no dispatch.
#
# A tag that already exists is skipped, never moved: a red run or a re-run
# cannot retag a published version. A refusal at the derivation stops that
# package only, and the packages beside it carry on; the summary names what was
# released, skipped and refused. A failure past the refusal (a broken gate, a
# failed publish) still fails the run: only refusals and existing tags skip.
#
# `workflow_dispatch` is the escape hatch, not the normal lane: no package
# releases every package with a pending release (the same plan as a push), a
# package name forces that single package, and `dry_run` (default true) stops
# before the tag and the publish.
#
# Tag convention: <package-name>@<version>
#   oc-flight-deck@0.20.2
#   @nathwn12/oc-bifrost@1.6.10        (scoped: two @ characters; split on the last)
#
# No Changesets: npm 12 breaks Changesets 2's `npm info --json` parsing, and
# these packages version independently.
#
# The releasable set is the ALLOWED list in scripts/release-target.mjs; every
# other workspace is source-only.
#
# OIDC trusted publishing only: id-token: write, --provenance; no auth-token
# variable, no secrets, no OTP.
#
# contents: write is for one act only: pushing the tags this run created. The
# lane never pushes a branch and never commits.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        # Empty is the batch lane. A name forces the single-package lane.
        # Releasable: @nathwn12/oc-bifrost, @nathwn12/janua, oc-flight-deck,
        # oc-harness-setup, oc-talk, rea-shim.
        description: Workspace package to release (empty = every package with a pending release)
        required: false
        default: ""
        type: string
      dry_run:
        description: Derive, gate and pack without tagging or publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # The plan: which packages this run may release, and what version each one
  # derives. Nothing irreversible happens here.
  plan:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      count: ${{ steps.derive.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the derivation reads each package's highest
          # tag and every commit since it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Derive the release set
        # The push lane's plan. A single-package dispatch is a matrix of one;
        # --prepare means the lane, not a committed bump, supplies the version
        # cells and the changelog close.
        id: derive
        shell: bash
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -n "${PACKAGE_INPUT}" ]; then
            node scripts/derive-release.mjs --package "${PACKAGE_INPUT}" --prepare
          else
            node scripts/derive-release.mjs --all
          fi

      - name: Nothing to release
        # Quiet green: no package has a releasable commit since its tag.
        if: ${{ steps.derive.outputs.count == '0' }}
        shell: bash
        run: |
          echo "nothing to release: no package has a releasable commit since its tag"
          {
            echo "## release"
            echo ""
            echo "nothing to release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard the dispatched commit is on origin/main
        # A push is main by definition; a dispatch can name any branch.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          subject="${GITHUB_SHA}"
          git fetch --no-tags origin main
          main="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$subject" "$main"; then
            echo "::error::dispatched commit is at ${subject}, which is not an ancestor of origin/main (${main}); merge it into main before releasing"
            exit 1
          fi

  # One job per package. Serialized on purpose: every leg pushes a tag and
  # publishes, so two legs at once would race. A release run is rare, and the
  # ordering it buys is worth the wall clock.
  release:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Derive the package version
        # The same derivation the plan ran, against this job's tree. A refusal
        # is recorded and this package is skipped; it is never fatal to the run.
        id: derive
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          status=0
          node scripts/derive-release.mjs --package "${PACKAGE}" --json --prepare > "$RUNNER_TEMP/release/derive.json" || status=$?
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
            for (const item of r.refusals ?? []) console.log(`  ${item.code}: ${item.message}`)
          ' "$RUNNER_TEMP/release/derive.json" || true
          echo "REFUSED=1" >> "$GITHUB_ENV"
          echo "::warning::${PACKAGE} refused at derivation; skipping it, the other packages carry on"

      - name: Fetch the tags
        # The tag guard reads the local tag list; fetch it after checkout so a
        # tag pushed earlier in this run is visible to a later leg.
        if: ${{ env.REFUSED != '1' }}
        shell: bash
        run: git fetch --tags --force origin

      - name: Skip a package whose tag already exists
        # Never retag, never move a tag: the version on the registry and the tag
        # on main stay the same commit they were published from.
        if: ${{ env.REFUSED != '1' }}
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if node scripts/derive-release.mjs --tag-exists "${TAG}"; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::notice::${TAG} already exists; skipping this package, no tag is ever moved"
          fi

      - name: Refuse a version that moved since the plan
        # Two derivations of the same tree must agree. A disagreement means the
        # plan read a different history, and nothing is built on a guess.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
          PLANNED: ${{ matrix.version }}
        run: |
          set -euo pipefail
          version="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(r.version))' "$RUNNER_TEMP/release/derive.json")"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [ "${version}" != "${PLANNED}" ]; then
            echo "::warning::${PACKAGE} derives ${version}, the plan said ${PLANNED}; skipping it"
            echo "REFUSED=1" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: npm ci

      - name: Close the changelog at the derived version
        # Before the pack, in the runner only: the tarball ships a changelog
        # whose section names this release. Never committed. Idempotent, so a
        # re-run writes nothing.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          args=(--package "${PACKAGE}" --version "${VERSION}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/close-changelog.mjs "${args[@]}"

      - name: Write the version cells in the runner
        # The manifest is the tarball's version; the root index cell and the
        # lockfile entry are the other two cells a release has to agree on. The
        # runner writes all three after install so the pack step verifies the
        # exact bytes that publish. Never committed; the last step restores them.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: node scripts/derive-release.mjs --write-cells --package "${PACKAGE}" --version "${VERSION}"

      - name: "Gate: build, test, tarball and cleanroom install"
        # The gate the tag may not precede. The cleanroom half is what proves a
        # packed tarball installs into an empty project and loads there.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: pwsh
        run: |
          npm run build
          node scripts/workspace-run.mjs test
          node scripts/pack-check.mjs
          node scripts/cleanroom.mjs

      - name: Assert the version cells (manifest, index, lockfile)
        # Read the three cells back after the write: the tarball, the index
        # claim and the lockfile must all name this version.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
        run: node scripts/derive-release.mjs --assert-cells --package "${PACKAGE}" --version "${VERSION}"

      - name: Create the release tag at the pushed commit
        # Immediately before the publish that names it, and only past the gate.
        # A tag that appeared during the gate is a race, not a retag: skip it.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' && !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::warning::tag ${TAG} appeared while the gate ran; skipping this package"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "tagged ${TAG} at $(git rev-parse HEAD)"

      - name: Publish (dry run)
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' && inputs.dry_run }}
        shell: pwsh
        run: npm publish --workspace "${{ matrix.name }}" --access public --dry-run

      - name: Publish (OIDC trusted publishing)
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' && !inputs.dry_run }}
        shell: pwsh
        run: npm publish --workspace "${{ matrix.name }}" --access public --provenance

      - name: Verify the released package on the registry
        # Post-publish only: the registry half cannot pass before the version
        # exists. npm can take several minutes to propagate a new version, so
        # retry only the not-published shape; every other failure is real.
        if: ${{ env.REFUSED != '1' && env.SKIP != '1' && !inputs.dry_run }}
        shell: pwsh
        run: |
          $attempts = 17
          # Observed propagation was 4-7 minutes. Ten attempts (~4 minutes)
          # would still fail at the upper bound, so 17 attempts with 30s waits
          # after the first three cap the wait at about 7m15s.
          $waits = @(10, 15, 20) + @(30) * ($attempts - 4)
          $name = "${{ matrix.name }}"
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $output = & pwsh -NoProfile -File scripts/check-index.ps1 --registry --package $name 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            $summary = ($output | Where-Object { $_ -match '^registry:' } | Select-Object -Last 1)
            Write-Output "attempt $attempt/$attempts (exit $code): $summary"
            if ($code -eq 0) { exit 0 }
            $fails = @($output | Where-Object { $_ -match '^FAIL' })
            $notPublished = @($fails | Where-Object { $_ -match 'npm\s+version\s+\S+\s+not published' })
            if ($fails.Count -eq 0 -or $notPublished.Count -ne $fails.Count) {
              Write-Output "not a propagation failure; not retrying"
              exit $code
            }
            if ($attempt -eq $attempts) { break }
            $wait = $waits[$attempt - 1]
            Write-Output "version not visible yet; waiting $wait seconds before attempt $($attempt + 1)"
            Start-Sleep -Seconds $wait
          }
          Write-Output "version still not visible after $attempts attempts"
          exit 1

      - name: Restore the runner-written cells
        # The release never commits: the version and the closed changelog exist
        # only for this job's tarball. Restore every tracked file and prove the
        # tree is clean, so main is byte-identical to the pushed commit.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          git checkout -- .
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "::error::working tree is not clean after the release:"
            echo "${dirty}"
            exit 1
          fi
          echo "tree: clean; nothing was committed"

      - name: Record the outcome
        # Always: a skipped or refused package is a result to report, not a
        # lost leg.
        if: always()
        shell: bash
        env:
          PACKAGE: ${{ matrix.name }}
          PLANNED: ${{ matrix.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          {
            echo "package=${PACKAGE}"
            echo "version=${VERSION:-${PLANNED}}"
            echo "refused=${REFUSED:-0}"
            echo "skipped=${SKIP:-0}"
            echo "dry_run=${DRY}"
          } > "$RUNNER_TEMP/release/result.txt"

      - name: Upload the outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release/result.txt
          if-no-files-found: warn

  summary:
    # Names what this run released, skipped and refused. Only a zero-package
    # plan omits the summary, and that run says "nothing to release" in plan.
    needs: release
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-result-*
          merge-multiple: true
          path: results

      - name: Name the released, the skipped and the refused
        shell: bash
        run: |
          set -euo pipefail
          released=0
          refused=0
          skipped=0
          {
            echo "## release"
            echo ""
            echo "| package | version | outcome |"
            echo "| --- | --- | --- |"
            for file in results/*.txt; do
              [ -e "${file}" ] || continue
              package="$(sed -n 's/^package=//p' "${file}")"
              version="$(sed -n 's/^version=//p' "${file}")"
              is_refused="$(sed -n 's/^refused=//p' "${file}")"
              is_skipped="$(sed -n 's/^skipped=//p' "${file}")"
              is_dry="$(sed -n 's/^dry_run=//p' "${file}")"
              if [ "${is_refused}" = "1" ]; then
                outcome="refused"
                refused=$((refused + 1))
              elif [ "${is_skipped}" = "1" ]; then
                outcome="skipped (tag exists)"
                skipped=$((skipped + 1))
              elif [ "${is_dry}" = "true" ]; then
                outcome="would release (dry run)"
                released=$((released + 1))
              else
                outcome="released"
                released=$((released + 1))
              fi
              echo "| ${package} | ${version} | ${outcome} |"
            done
            echo ""
            echo "released ${released}, skipped ${skipped}, refused ${refused}"
          } >> "$GITHUB_STEP_SUMMARY"
