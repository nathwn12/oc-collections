# Tag-driven release for the three releasable npm packages.
#
# Tag convention: <package-name>@<version>
#   oc-flight-deck@0.20.2
#   @nathwn12/oc-bifrost@1.6.10        (scoped: two @ characters; split on the last)
#
# No Changesets: npm 12 breaks Changesets 2's `npm info --json` parsing, and
# these packages version independently.
#
# The releasable set is the ALLOWED list in scripts/release-target.mjs; the
# dispatch choice list below must match it, and every other workspace is
# source-only.
#
# OIDC trusted publishing only: id-token: write, --provenance; no auth-token
# variable, no secrets, no OTP.
name: release

on:
  push:
    tags:
      - '**@*'
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to release
        required: true
        type: choice
        options:
          - '@nathwn12/oc-bifrost'
          - oc-flight-deck
          - oc-harness-setup
      dry_run:
        description: Validate and pack without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/release-target.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/release-target.mjs --package "${{ inputs.package }}"
          fi

      - name: Guard registry state (never republish, never retag)
        shell: bash
        run: |
          set -euo pipefail
          npm view "${{ steps.target.outputs.name }}" versions --json > "$RUNNER_TEMP/versions.json"
          node scripts/release-target.mjs --registry-guard "$RUNNER_TEMP/versions.json" "${{ steps.target.outputs.version }}"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Workspace check
        shell: pwsh
        run: npm run check

      - name: Workspace pack verification
        shell: pwsh
        run: npm run pack:check

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: pwsh
        run: npm publish --workspace "${{ steps.target.outputs.name }}" --access public --dry-run

      - name: Publish (OIDC trusted publishing)
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        shell: pwsh
        run: npm publish --workspace "${{ steps.target.outputs.name }}" --access public --provenance

      - name: Verify the released package on the registry
        # Post-publish only: the registry half cannot pass before the version
        # exists. It is scoped to this run's package; the full table is checked
        # by the same command without --package. A dry run publishes nothing,
        # so there is no registry state to verify. npm can take several minutes
        # to propagate a new version, so retry only the not-published shape;
        # every other failure is a real failure and exits immediately.
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        shell: pwsh
        run: |
          $attempts = 17
          # Observed propagation was 4-7 minutes. Ten attempts (~4 minutes)
          # would still fail at the upper bound, so 17 attempts with 30s waits
          # after the first three cap the wait at about 7m15s.
          $waits = @(10, 15, 20) + @(30) * ($attempts - 4)
          $name = "${{ steps.target.outputs.name }}"
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $output = & pwsh -NoProfile -File scripts/check-index.ps1 --registry --package $name 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            $summary = ($output | Where-Object { $_ -match '^registry:' } | Select-Object -Last 1)
            Write-Output "attempt $attempt/$attempts (exit $code): $summary"
            if ($code -eq 0) { exit 0 }
            $fails = @($output | Where-Object { $_ -match '^FAIL' })
            $notPublished = @($fails | Where-Object { $_ -match 'npm\s+version\s+\S+\s+not published' })
            if ($fails.Count -eq 0 -or $notPublished.Count -ne $fails.Count) {
              Write-Output "not a propagation failure; not retrying"
              exit $code
            }
            if ($attempt -eq $attempts) { break }
            $wait = $waits[$attempt - 1]
            Write-Output "version not visible yet; waiting $wait seconds before attempt $($attempt + 1)"
            Start-Sleep -Seconds $wait
          }
          Write-Output "version still not visible after $attempts attempts"
          exit 1
