version: 2
# Free on a public repository.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Kept on 7.2.0 deliberately: @opentui/core, which draws these cells,
      # still bundles string-width 7.2.0 and measures U+26A0 as two cells.
      # Measuring with 9.0.0 would make the width test disagree with the
      # rendered output. Drop this entry when @opentui/core moves to v9.
      - dependency-name: "string-width"
        versions: [">7.2.0"]

  - package-ecosystem: "cargo"
    # The root Cargo.toml is an empty virtual workspace (members = []) with no
    # Cargo.lock. These two package directories are the only Cargo lockdirs;
    # Dependabot's native `directories` key covers both in one entry.
    directories:
      - "/packages/oc-gladius"
      - "/packages/oc-puppet"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Manila"
    # One grouped minor/patch PR per real lockdir is the low-noise steady state;
    # security updates use their own separate limit.
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
